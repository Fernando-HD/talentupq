databases:
  - name: talentupq-db
    plan: basic-256mb
    region: oregon
    databaseName: bolsatrabajoupq
    user: talentupq
    ipAllowList: []

services:
  # Flask sirve tanto las páginas web como /api/v1 para la aplicación móvil.
  # Dos instancias Starter activan el balanceador administrado de Render.
  - name: talentupq-api
    type: web
    runtime: docker
    plan: starter
    region: oregon
    numInstances: 2
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    preDeployCommand: python scripts/init_cloud_db.py
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: talentupq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://talentupq-api.onrender.com
      - key: WEBAUTHN_RP_ID
        value: talentupq-api.onrender.com
      - key: WEBAUTHN_ORIGIN
        value: https://talentupq-api.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://talentupq-api.onrender.com/auth/google/callback
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
