databases:
  - name: talentupq-db
    plan: basic-256mb
    region: oregon
    databaseName: bolsatrabajoupq
    user: talentupq
    ipAllowList: []

services:
  # Flask sirve tanto las páginas web como /api/v1 para la aplicación móvil.
  # Dos instancias Starter activan el balanceador administrado de Render.
  - name: talentupq-api
    type: web
    runtime: docker
    plan: starter
    region: oregon
    numInstances: 2
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    preDeployCommand: python scripts/init_cloud_db.py
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: talentupq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://talentupq-api.onrender.com
      - key: WEBAUTHN_RP_ID
        value: talentupq-api.onrender.com
      - key: WEBAUTHN_ORIGIN
        value: https://talentupq-api.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://talentupq-api.onrender.com/auth/google/callback
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

  # Prometheus consulta las métricas del API desplegado. El disco conserva el
  # historial entre despliegues y permite mostrar evidencia en Grafana.
  - name: talentupq-prometheus
    type: web
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./infra/prometheus/Dockerfile.render
    dockerContext: ./infra/prometheus
    healthCheckPath: /-/healthy
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 9090
    disk:
      name: prometheus-data
      mountPath: /prometheus
      sizeGB: 1

  # Grafana queda accesible para la demostración, con el dashboard de operación
  # y seguridad aprovisionado automáticamente.
  - name: talentupq-grafana
    type: web
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./infra/grafana/Dockerfile.render
    dockerContext: ./infra/grafana
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 3000
      - key: GF_SERVER_HTTP_PORT
        value: 3000
      - key: GF_SECURITY_ADMIN_USER
        value: admin
      - key: GF_SECURITY_ADMIN_PASSWORD
        generateValue: true
      - key: PROMETHEUS_HOSTPORT
        fromService:
          name: talentupq-prometheus
          type: web
          property: hostport
    disk:
      name: grafana-data
      mountPath: /var/lib/grafana
      sizeGB: 1
