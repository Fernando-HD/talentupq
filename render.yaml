services:
  # API Flask
  - name: talentupq-api
    type: web
    dockerfilePath: Dockerfile
    envVars:
      - key: DB_HOST
        value: sqlserver
      - key: DB_PORT
        value: "1433"
      - key: DB_NAME
        value: BolsaTrabajoUPQ
      - key: DB_USER
        value: sa
      - key: DB_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: FLASK_ENV
        value: production
      - key: SQL_SERVER_ENCRYPT
        value: "yes"
      - key: SQL_SERVER_TRUST_SERVER_CERTIFICATE
        value: "yes"
      - key: OPENAI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
    healthCheckPath: /health

  # Cliente React
  - name: talentupq-client
    type: web
    dockerfilePath: frontend-react/Dockerfile
    envVars:
      - key: REACT_APP_API_URL
        value: https://talentupq-api.onrender.com/api/v1
