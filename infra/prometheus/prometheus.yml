global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: talentupq-api-1
    static_configs:
      - targets: ["api_1:5000"]
  - job_name: talentupq-api-2
    static_configs:
      - targets: ["api_2:5000"]
  - job_name: talentupq-firewall-gateway
    static_configs:
      - targets: ["nginx_exporter:9113"]
