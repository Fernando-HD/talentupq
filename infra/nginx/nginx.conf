user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format security '$remote_addr - $request_id [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log security;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;
    server_tokens off;

    upstream talentupq_private {
        least_conn;
        server api_1:5000 max_fails=3 fail_timeout=15s;
        server api_2:5000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        location = /nginx_status {
            stub_status;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            deny all;
        }

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/talentupq.crt;
        ssl_certificate_key /etc/nginx/certs/talentupq.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'" always;

        client_max_body_size 12m;
        limit_conn per_ip 20;

        location = /metrics {
            return 403;
        }

        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://talentupq_private;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://talentupq_private;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
