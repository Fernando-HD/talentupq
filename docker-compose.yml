services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-bolsatrabajoupq}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed_catalogs.sql:/docker-entrypoint-initdb.d/02-catalogs.sql:ro
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bolsatrabajoupq}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api_1: &api
    build: .
    environment: &api_environment
      PORT: "5000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-bolsatrabajoupq}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-jwt-change-me}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost:8443}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FLASK_ENV: production
    expose: ["5000"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped
    volumes:
      - uploads_data:/app/static/uploads

  api_2:
    <<: *api
    environment: *api_environment

  public_gateway:
    build: ./infra/nginx
    ports:
      - "8080:80"
      - "8443:443"
    depends_on: [api_1, api_2]
    networks: [edge, backend]
    restart: unless-stopped

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command: ["--nginx.scrape-uri=http://public_gateway/nginx_status"]
    depends_on: [public_gateway]
    networks: [edge, monitoring]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: [api_1, api_2, nginx_exporter]
    networks: [backend, monitoring]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-talentupq-admin-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [monitoring]
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  prometheus_data:
  grafana_data:

networks:
  edge:
  backend:
    internal: true
  monitoring:
    internal: true
