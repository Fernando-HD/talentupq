{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-background">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
        <div class="particles-container" id="particles-js"></div>
    </div>
    
    <div class="auth-card animate-on-scroll">
        <div class="auth-header">
            <div class="auth-icon">
                <i class="fas fa-sign-in-alt"></i>
            </div>
            <h2>Iniciar Sesión</h2>
            <p>Ingresa tus credenciales para acceder</p>
        </div>
        
        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="form-group">
                <div class="input-container">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" name="email" class="form-control" required placeholder=" ">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <div class="form-underline"></div>
                </div>
            </div>
            
            <div class="form-group">
                <div class="input-container">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" class="form-control" required placeholder=" ">
                    <label for="password" class="form-label">Contraseña</label>
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <i class="fas fa-eye"></i>
                    </button>
                    <div class="form-underline"></div>
                </div>
            </div>
            
            <div class="form-options">
    <label class="checkbox-container">
        <input type="checkbox" id="remember" name="remember">
        <span class="checkmark"></span>
        Recordar sesión
    </label>
    <a href="{{ url_for('forgot_password') }}" class="forgot-password">¿Olvidaste tu contraseña?</a>
</div>
            
            <div class="form-group">
                <button type="submit" class="btn btn-primary btn-block login-btn">
                    <span class="btn-text">Iniciar Sesión</span>
                    <div class="btn-loader">
                        <div class="loader-dot"></div>
                        <div class="loader-dot"></div>
                        <div class="loader-dot"></div>
                    </div>
                    <i class="fas fa-arrow-right btn-icon"></i>
                </button>
            </div>
            
            <div class="auth-footer">
                <p>¿No tienes una cuenta? <a href="{{ url_for('registro') }}" class="auth-link">Regístrate aquí</a></p>
            </div>
        </form>
    </div>
</div>

<style>

        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        overflow: hidden;
    }
    
    .auth-background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;

    }
    
    .floating-shape {
        position: absolute;
        border-radius: 50%;
        opacity: 0.08;
        animation: float 20s infinite ease-in-out;
    }
    
    .shape-1 {
        width: 150px;
        height: 150px;
        background: linear-gradient(135deg, #3498db, #2ecc71);
        top: 10%;
        left: 5%;
        animation-delay: 0s;
    }
    
    .shape-2 {
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, #2ecc71, #3498db);
        top: 70%;
        right: 10%;
        animation-delay: 7s;
    }
    
    .shape-3 {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #3498db, #9b59b6);
        bottom: 20%;
        left: 15%;
        animation-delay: 14s;
    }
    
    .particles-container {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 1;
    }
    
    .auth-card {

        padding: 3rem;

    .auth-card:hover {

    }
    
    .auth-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }
    
    .auth-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        background: linear-gradient(135deg, #3498db, #2ecc71);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 2rem;

    .auth-header h2 {

        margin-bottom: 0.5rem;

        font-weight: 700;

        -webkit-text-fill-color: transparent;

    }
    
    .auth-header p {
        color: #5a6c7d;
        font-size: 1.1rem;
    }
    
    .auth-form {
        width: 100%;
    }
    
    .form-group {
        margin-bottom: 2rem;
    }
    
    .input-container {
        position: relative;
    }
    
    .input-icon {
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        color: #3498db;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        z-index: 2;
    }
    
    .form-control {
        width: 100%;
        padding: 14px 14px 14px 35px;
        border: none;
        background: transparent;
        border-bottom: 2px solid #e1e5e9;
        font-size: 1rem;
        transition: all 0.3s ease;

        font-weight: 500;

        z-index: 1;

    .form-label {

        font-weight: 500;
        transition: all 0.3s ease;
        pointer-events: none;

        transform-origin: left;

        margin: 0;
    }

        font-weight: 600;
        transition: color 0.3s ease;

    }

        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 2px;

    .loading .btn-icon {

    }

    }

            height: 70px;

            padding: 20px 15px;
        }

            padding: 1.5rem;
            border-radius: 16px;
        }
    }
</style>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.querySelector('.password-toggle i');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.classList.remove('fa-eye');
            toggleIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            toggleIcon.classList.remove('fa-eye-slash');
            toggleIcon.classList.add('fa-eye');
        }
    }
    
    // Form submission animation
    document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.querySelector('.auth-form');
        const loginBtn = document.querySelector('.login-btn');
        
        loginForm.addEventListener('submit', function(e) {
            // Simulate loading state
            loginBtn.classList.add('loading');
            
            // Let the form submit normally after animation
            setTimeout(() => {
                loginBtn.classList.remove('loading');
            }, 2000);
        });
        
        // Add floating label functionality
        const formInputs = document.querySelectorAll('.form-control');
        
        formInputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });
            
            input.addEventListener('blur', function() {
                if (this.value === '') {
                    this.parentElement.classList.remove('focused');
                }
            });
            
            // Check if input has value on page load
            if (input.value !== '') {
                input.parentElement.classList.add('focused');
            }
        });
        
        // Simple particle effect
        createParticles();
    });
    
    function createParticles() {
        const container = document.querySelector('.particles-container');
        const particleCount = 15;
        
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.cssText = `
                position: absolute;
                width: 4px;
                height: 4px;
                background: rgba(52, 152, 219, 0.3);
                border-radius: 50%;
                left: ${Math.random() * 100}%;
                top: ${Math.random() * 100}%;
                animation: particleFloat ${10 + Math.random() * 20}s infinite linear;
                animation-delay: ${Math.random() * 5}s;
            `;
            container.appendChild(particle);
        }
        
        // Add particle animation to styles
        const style = document.createElement('style');
        style.textContent = `
            @keyframes particleFloat {
                0% {
                    transform: translateY(100vh) rotate(0deg);
                    opacity: 0;
                }
                10% {
                    opacity: 1;
                }
                90% {
                    opacity: 1;
                }
                100% {
                    transform: translateY(-100px) rotate(360deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    }
</script>

<script>
    // Detector de combinación de teclas para acceso admin mejorado
    document.addEventListener('DOMContentLoaded', function() {
        let inputSequence = [];
        const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
        const modKey = isMac ? 'Meta' : 'Control';
        const secretSequence = [modKey, 'a', 'b', 'c'];
        
        document.addEventListener('keydown', function(e) {
            // Agregar la tecla presionada al array
            inputSequence.push(e.key);
            
            // Mantener solo los últimos N elementos (longitud de la secuencia secreta)
            if (inputSequence.length > secretSequence.length) {
                inputSequence.shift();
            }
            
            // Verificar si coincide con la secuencia secreta
            if (arraysEqual(inputSequence, secretSequence)) {
                // Mostrar el modal con animación
                const modal = document.getElementById('adminLoginModal');
                modal.classList.remove('hidden');
                modal.classList.add('show');
                
                // Resetear la secuencia
                inputSequence = [];
                
                // Enfocar el primer campo de entrada
                setTimeout(() => {
                    document.getElementById('adminEmail').focus();
                }, 300);
            }
        });
        
        // Función para comparar arrays
        function arraysEqual(a, b) {
            if (a.length !== b.length) return false;
            for (let i = 0; i < a.length; i++) {
                if (a[i] !== b[i]) return false;
            }
            return true;
        }
        // Manejar el envío del formulario de admin
document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
    const modal = document.getElementById('adminLoginModal');
    const modalContent = modal.querySelector('.admin-modal-content');
    // Las credenciales se validan exclusivamente en el servidor.
    modalContent.classList.add('animate__animated', 'animate__fadeOutUp');
});
        
        // Cerrar modal al hacer clic en la X
        document.querySelector('.admin-close-btn').addEventListener('click', function() {
            const modal = document.getElementById('adminLoginModal');
            modal.classList.remove('show');
            modal.classList.add('hidden');
            
            // Resetear formulario
            document.getElementById('adminLoginForm').reset();
            
            // Resetear secuencia
            inputSequence = [];
        });
        
        // Cerrar modal al hacer clic fuera del contenido
        document.getElementById('adminLoginModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('show');
                this.classList.add('hidden');
                
                // Resetear formulario
                document.getElementById('adminLoginForm').reset();
                
                // Resetear secuencia
                inputSequence = [];
            }
        });

    // ========== RECONOCIMIENTO FACIAL ==========
let faceModelsLoaded = false;
let facialVideo = null;
let facialStream = null;


// ========== CONTROL DE PESTAÑAS ==========
function initAdminTabs() {
    console.log('Inicializando pestañas...');
    
    const passwordTab = document.querySelector('.admin-tab[data-tab="password"]');
    const facialTab = document.querySelector('.admin-tab[data-tab="facial"]');
    const passwordPanel = document.getElementById('passwordPanel');
    const facialPanel = document.getElementById('facialPanel');
    
    if (!passwordTab || !facialTab || !passwordPanel || !facialPanel) {
        console.error('No se encontraron las pestañas o paneles');
        return;
    }
    
    // Función para mostrar pestaña de contraseña
    function showPasswordTab() {
        passwordTab.classList.add('active');
        facialTab.classList.remove('active');
        passwordPanel.style.display = 'block';
        facialPanel.style.display = 'none';
        stopFacialCamera();
        console.log('Mostrando panel de contraseña');
    }
    
    // Función para mostrar pestaña facial
    function showFacialTab() {
        facialTab.classList.add('active');
        passwordTab.classList.remove('active');
        passwordPanel.style.display = 'none';
        facialPanel.style.display = 'block';
        console.log('Mostrando panel facial');
        loadFaceModels();
    }
    
    // Agregar event listeners
    passwordTab.addEventListener('click', showPasswordTab);
    facialTab.addEventListener('click', showFacialTab);
    
    // Asegurar que el panel de contraseña esté visible al inicio
    showPasswordTab();
}


// Cargar modelos de Face-api
async function loadFaceModels() {
    const status = document.getElementById('facialStatus');
    if (!status) return;
    
    if (faceModelsLoaded) {
        status.innerHTML = '<i class="fas fa-check-circle"></i> Modelos listos';
        status.style.color = '#4caf50';
        const startBtn = document.getElementById('startCameraBtn');
        if (startBtn) startBtn.disabled = false;
        return;
    }
    
    status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cargando modelos...';
    
    try {
        const MODEL_URL = '/static/models';
        console.log('Cargando modelos desde:', MODEL_URL);
        
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        
        faceModelsLoaded = true;
        status.innerHTML = '<i class="fas fa-check-circle"></i> Modelos listos';
        status.style.color = '#4caf50';
        
        const startBtn = document.getElementById('startCameraBtn');
        if (startBtn) startBtn.disabled = false;
    } catch (error) {
        console.error('Error cargando modelos:', error);
        status.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Error cargando modelos';
        status.style.color = '#f44336';
    }
}

// Iniciar cámara
async function startFacialCamera() {
    const btn = document.getElementById('startCameraBtn');
    const status = document.getElementById('facialStatus');
    
    if (!faceModelsLoaded) {
        status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Esperando modelos...';
        return;
    }
    
    try {
        facialStream = await navigator.mediaDevices.getUserMedia({ video: true });
        facialVideo = document.getElementById('facialVideo');
        facialVideo.srcObject = facialStream;
        await facialVideo.play();
        
        if (btn) btn.disabled = true;
        const verifyBtn = document.getElementById('verifyFaceBtn');
        if (verifyBtn) verifyBtn.disabled = false;
        
        status.innerHTML = '<i class="fas fa-smile"></i> Cámara activa. Mira al frente.';
        status.style.color = '#4caf50';
    } catch (error) {
        console.error('Error:', error);
        status.innerHTML = '<i class="fas fa-exclamation-triangle"></i> No se pudo acceder a la cámara';
        status.style.color = '#f44336';
    }
}

// Verificar rostro
async function verifyFace() {
    const btn = document.getElementById('verifyFaceBtn');
    const msg = document.getElementById('facialMessage');
    
    if (!facialVideo || !facialStream) {
        if (msg) {
            msg.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Inicia la cámara primero';
            msg.className = 'facial-message error';
        }
        return;
    }
    
    if (btn) btn.disabled = true;
    if (msg) {
        msg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';
        msg.className = 'facial-message';
    }
    
    try {
        const canvas = document.getElementById('facialCanvas');
        canvas.width = facialVideo.videoWidth;
        canvas.height = facialVideo.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(facialVideo, 0, 0, canvas.width, canvas.height);
        
        const detections = await faceapi.detectAllFaces(canvas, 
            new faceapi.TinyFaceDetectorOptions());
        
        if (detections.length === 1) {
            if (msg) {
                msg.innerHTML = '<i class="fas fa-check-circle"></i> ✅ Rostro verificado! Redirigiendo...';
                msg.className = 'facial-message success';
            }
            setTimeout(() => {
                window.location.href = "{{ url_for('admin_dashboard') }}";
            }, 1500);
        } else if (detections.length > 1) {
            if (msg) {
                msg.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Múltiples rostros detectados';
                msg.className = 'facial-message error';
            }
            if (btn) btn.disabled = false;
        } else {
            if (msg) {
                msg.innerHTML = '<i class="fas fa-exclamation-triangle"></i> No se detectó ningún rostro';
                msg.className = 'facial-message error';
            }
            if (btn) btn.disabled = false;
        }
    } catch (error) {
        console.error('Error:', error);
        if (msg) {
            msg.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Error en la verificación';
            msg.className = 'facial-message error';
        }
        if (btn) btn.disabled = false;
    }
}

function stopFacialCamera() {
    if (facialStream) {
        facialStream.getTracks().forEach(track => track.stop());
        facialStream = null;
    }
    if (facialVideo) {
        facialVideo.srcObject = null;
    }
    const startBtn = document.getElementById('startCameraBtn');
    if (startBtn) startBtn.disabled = false;
    const verifyBtn = document.getElementById('verifyFaceBtn');
    if (verifyBtn) verifyBtn.disabled = true;
    const status = document.getElementById('facialStatus');
    if (status) {
        status.innerHTML = '<i class="fas fa-camera"></i> Iniciar cámara';
        status.style.color = 'white';
    }
}


// Inicializar cuando el DOM esté listo
document.addEventListener('DOMContentLoaded', function() {

    const verifyBtn = document.getElementById('verifyFaceBtn');
    
    if (startBtn) {

    if (verifyBtn) {

        console.log('Botón de verificación conectado');
    }
    
    const closeBtn = document.querySelector('.admin-close-btn');
    if (closeBtn) {
        closeBtn.addEventListener('click', stopFacialCamera);
    }
    
    const modal = document.getElementById('adminLoginModal');
    if (modal) {
        modal.addEventListener('click', function(e) {

        });
    }

    const passkeyButton = document.getElementById('adminPasskeyLogin');
    if (passkeyButton) passkeyButton.addEventListener('click', loginWithPasskey);

function base64urlToBuffer(value) {
    const base64 = value.replace(/-/g, '+').replace(/_/g, '/');
    const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
    return Uint8Array.from(atob(padded), char => char.charCodeAt(0));
}

function bufferToBase64url(value) {
    const bytes = new Uint8Array(value);
    let binary = '';
    bytes.forEach(byte => { binary += String.fromCharCode(byte); });
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function loginWithPasskey() {
    const message = document.getElementById('passkeyLoginMessage');
    if (!window.PublicKeyCredential) {
        message.textContent = 'Este navegador no admite huella, rostro o passkeys.';
        message.className = 'facial-message error';
        return;
    }
    try {
        message.textContent = 'Esperando verificación del dispositivo…';
        message.className = 'facial-message';
        const optionsResponse = await fetch('/admin/passkeys/login/options', { method: 'POST' });
        const options = await optionsResponse.json();
        if (!optionsResponse.ok) throw new Error(options.error || 'No hay una passkey registrada.');
        options.challenge = base64urlToBuffer(options.challenge);
        options.allowCredentials = (options.allowCredentials || []).map(item => ({
            ...item,
            id: base64urlToBuffer(item.id),
        }));
        const credential = await navigator.credentials.get({ publicKey: options });
        const payload = {
            id: credential.id,
            rawId: bufferToBase64url(credential.rawId),
            type: credential.type,
            response: {
                authenticatorData: bufferToBase64url(credential.response.authenticatorData),
                clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
                signature: bufferToBase64url(credential.response.signature),
                userHandle: credential.response.userHandle
                    ? bufferToBase64url(credential.response.userHandle) : null,
            },
            clientExtensionResults: credential.getClientExtensionResults(),
            authenticatorAttachment: credential.authenticatorAttachment,
        };
        const verifyResponse = await fetch('/admin/passkeys/login/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        const result = await verifyResponse.json();
        if (!verifyResponse.ok) throw new Error(result.error || 'Identidad no verificada.');
        window.location.assign(result.redirect);
    } catch (error) {
        message.textContent = error.name === 'NotAllowedError'
            ? 'La verificación fue cancelada o excedió el tiempo.' : error.message;
        message.className = 'facial-message error';
    }
}
